# Resource World Portal Configuration
# Creates a portal to a resource world for gathering materials
#
# The world is created by Portals itself (World.Create: true). Options:
#
#   # Normal world with default terrain:
#   Environment: NORMAL
#
#   # Amplified terrain (tall mountains):
#   Environment: NORMAL
#   Generator: minecraft:amplified
#
#   # A fixed seed, so every install gets the same world:
#   Seed: "12345"
#
# If you manage worlds with another plugin instead, leave Create out and
# just set World.Name to the existing world.
configVersion: "3.0.1"

Enable: true
DisplayName: "Resource World Portal"

Portal:
  Frame:
    Material: COBBLESTONE
    Face: all
  InsideMaterial: NETHER_PORTAL
  LighterMaterial: FLINT_AND_STEEL
  BreakEffect: BLOCK_GLASS_BREAK
  MinimumHeight: 4
  MaximumHeight: 15
  MinimumWidth: 3
  MaximumWidth: 14

World:
  Name: resource_world
  Create: true

Options:
  AllowedWorlds:
    - all
  ExitPortal:
    Enable: true
    FixedWidth: -1
    FixedHeight: -1
  TeleportDelay: 4

Entities:
  Transformation: []
  Spawning:
    Delay: "5000-10000"
    List: []
